
{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Admin Dashboard</h2>
    {% if top_user and top_user.total %}
        <div class="card mt-4">
            <div class="card-body">
                <h4 class="card-title">Top Purchaser: {{ top_user.username }}</h4>
                <p class="card-text">Total Movies Purchased: {{ top_user.total }}</p>
            </div>
        </div>
    {% else %}
        <div class="alert alert-info mt-4">
            No top purchaser yet.
        </div>
    {% endif %}
</div>
{% endblock content %}
